name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release-unsigned
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --version

      - name: Verify strict offline manifest
        run: |
          if grep -Eq 'uses-permission[^>]+android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "Unexpected INTERNET permission in the offline app manifest."
            exit 1
          fi

      - name: Run unit tests and build Debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build unsigned Release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release-unsigned'
        run: gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslator-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -type f -name "*.apk" -exec cp -v {} out/ \;
          test -n "$(find out -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslator-${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
